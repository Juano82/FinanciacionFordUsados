<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Ford ICBC - Compacto Celeste</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
    </style>

    <style>
        body { 
            font-family: 'Google Sans', 'Roboto', sans-serif; 
            background-color: #f4f4f4; 
            padding: 20px; 
        }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        
        .header { background-color: #2BA8E0; color: white; padding: 12px; text-align: center; border-radius: 8px; margin-bottom: 15px; }
        .header h2 { margin: 0; font-size: 18px; }
        
        .form-group { margin-bottom: 10px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #444; margin-bottom: 4px; }
        
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        input[type="text"], select {
            width: 100%; padding: 6px 10px; border: 1px solid #ddd; border-radius: 6px; 
            box-sizing: border-box; font-size: 14px; background-color: #fafafa;
            font-family: 'Google Sans', 'Roboto', sans-serif; 
        }
        
        input[type="text"]:focus, select:focus { border-color: #2BA8E0; outline: none; background-color: white; }
        
        @media (max-width: 480px) {
            .grid-3, .grid-2 { grid-template-columns: 1fr; }
        }
        
        .slider-container { margin-top: 5px; }
        input[type="range"] { -webkit-appearance: none; width: 100%; height: 6px; border-radius: 5px; background: #e0e0e0; outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #2BA8E0; cursor: pointer; border: 2px solid white; box-shadow: 0 2px 4px rgba(43,168,224,0.4); }
        input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #2BA8E0; cursor: pointer; border: 2px solid white; }
        
        .monto-display {
            font-size: 32px !important; 
            font-weight: bold !important; 
            color: #2BA8E0 !important; 
            text-align: center;
            margin-top: 8px !important; 
            padding: 10px !important; 
            background-color: #E6F7FF !important; 
            border-radius: 6px;
            width: 100%; 
            box-sizing: border-box; 
            border: 1px solid #E6F7FF !important; 
            cursor: text;
        }
        .monto-display:focus { border-color: #2BA8E0; outline: none; background-color: #ffffff; }
        
        .slider-limits { display: flex; justify-content: space-between; font-size: 10px; color: #666; margin-top: 2px; }
        .hint-monto { display: block; font-size: 10px; color: #666; margin-top: 4px; text-align: center; }

        #resultado { margin-top: 15px; padding: 12px; background-color: #f9f9f9; border: 1px solid #eee; border-radius: 8px; }
        .grid-resultados { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        
        .fila-resultado { background: white; padding: 6px 8px; border-radius: 4px; border: 1px solid #eee; }
        .fila-resultado span { display: block; font-size: 10px; color: #666; margin-bottom: 2px; }
        .fila-resultado strong { font-size: 14px; color: #333; }

        .total { 
            grid-column: span 3; 
            background-color: #2BA8E0; 
            color: white; 
            text-align: center; 
            padding: 15px; 
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(43, 168, 224, 0.4); 
            margin-bottom: 10px;
        }
        .total span { 
            display: block; 
            font-size: 16px; 
            color: #E6F7FF; 
            margin-bottom: 5px; 
            letter-spacing: 0.5px;
        }
        .total strong { 
            color: white; 
            font-size: 32px; 
            font-weight: 800; 
            line-height: 1;
        }

        .anticipo-box {
            grid-column: span 3; 
            background-color: #f0faff;
            border: 2px solid #2BA8E0;
            border-radius: 6px;
            padding: 12px;
            text-align: center;
        }
        
        .anticipo-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 5px;
        }
        .anticipo-header span {
            font-size: 14px;
            font-weight: bold;
            color: #2BA8E0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-min {
            background-color: #2BA8E0;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 2px 10px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-min:hover {
            background-color: #1f8ab8;
        }
        
        .anticipo-input {
            font-size: 36px !important; 
            font-weight: 800 !important;
            color: #2BA8E0 !important;
            text-align: center;
            background: white !important;
            border: 1px solid #2BA8E0 !important;
            border-radius: 6px !important;
            width: 100% !important;
            box-sizing: border-box !important;
            padding: 10px !important; 
            margin-bottom: 5px !important;
            outline: none !important;
            line-height: 1.2 !important;
        }
        .anticipo-input:focus {
            box-shadow: 0 0 0 3px rgba(43, 168, 224, 0.2);
            border-color: #1f8ab8;
        }
        
        .anticipo-box small {
            display: block;
            font-size: 14px; 
            font-weight: 700;
            color: #333; 
            margin-top: 10px;
            line-height: 2; 
        }
        
        .aviso-info { background-color: #E6F7FF; border-left: 3px solid #2BA8E0; padding: 8px; margin-top: 10px; border-radius: 4px; display: none; font-size: 12px; color: #333; }
        .nota { font-size: 10px; color: #666; margin-top: 10px; line-height: 1.4; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Simulador Usados Ford ICBC</h2>
    </div>

    <div class="grid-3">
        <div class="form-group">
            <label>Valor unidad (ARS)</label>
            <input type="text" id="valorUnidad" placeholder="$ 0" 
                   oninput="formatMoney(this); resetearEdicion(); actualizarMontoMaximo(); actualizarCalculo();">
        </div>
        <div class="form-group">
            <label>Año del vehículo</label>
            <select id="anio" onchange="resetearEdicion(); actualizarMontoMaximo(); actualizarCalculo();"></select>
        </div>
        <div class="form-group">
            <label>Entrega de usado</label>
            <input type="text" id="entregaUsado" placeholder="$ 0" 
                   oninput="formatMoney(this); resetearEdicion(); actualizarMontoMaximo(); actualizarCalculo();">
        </div>
    </div>

    <div class="form-group">
        <label>Saldo a financiar</label>
        <div class="slider-container">
            <input type="range" id="monto" min="0" max="0" value="0" step="1" 
                   oninput="actualizarTextoMonto(); actualizarCalculo();" disabled>
            <div class="slider-limits">
                <span id="montoMin">$ 0</span>
                <span id="montoMax">$ 0</span>
            </div>
            <input type="text" id="montoDisplay" class="monto-display" 
                   placeholder="$ 0" oninput="handleManualInput(this)" onblur="finalizarEdicion('monto')">
        </div>
        <small id="hintMonto" class="hint-monto"></small>
    </div>

    <div class="grid-2">
        <div class="form-group">
            <label>Tipo de Financiación</label>
            <select id="tipo" onchange="resetearEdicion(); actualizarCuotas(); actualizarCalculo();">
                <option value="especial">Tasa Especial Usados</option>
                <option value="oportunidad">Tasa Gral. Oportunidad</option>
                <option value="promocional">Tasa Gral. Promocional</option>
                <option value="green">Tasa Green (Híbridos)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Cantidad de Cuotas</label>
            <select id="cuotas" onchange="resetearEdicion(); actualizarCalculo();"></select>
        </div>
    </div>

    <div id="avisoLimite" class="aviso-info"></div>

    <div id="resultado">
        <div id="mensaje-inicial" style="font-size: 12px; color: #888; text-align: center; padding: 10px;">Ingrese el valor de la unidad para calcular.</div>
        
        <div id="detalle-calculado" style="display: none;">
            <div class="grid-resultados">
                
                <div class="fila-resultado"><span>CFT (TEA)</span> <strong id="res-cft"></strong></div>
                <div class="fila-resultado"><span>Capital Financiado</span> <strong id="res-capital"></strong></div>
                <div class="fila-resultado"><span>TNA</span> <strong id="res-tna"></strong></div>
                
                <div class="total">
                    <span>1ra Cuota</span>
                    <strong id="res-primera-cuota"></strong>
                </div>

                <div class="anticipo-box">
                    <div class="anticipo-header">
                        <span>Anticipo Total</span>
                        <button class="btn-min" onclick="calcularAnticipoMinimo()">Min</button>
                    </div>
                    <input type="text" id="anticipoInput" class="anticipo-input" 
                           placeholder="$ 0" oninput="handleAnticipoInput(this)" onblur="finalizarEdicion('anticipo')">
                    <small id="res-detalle-anticipo"></small>
                </div>

            </div>
            <div style="font-size: 10px; color: #666; margin-top: 8px; text-align: center;" id="res-aviso"></div>
        </div>
    </div>

    <div class="nota">
        * Escribí el anticipo que querés pagar y el sistema calculará automáticamente cuánto te queda por financiar. El botón Min te lleva al financiamiento máximo.
    </div>
</div>

<script>
    const editing = { monto: false, anticipo: false };

    const datosFinanciacion = {
        especial: { 
            tasas: { 12: { tna: 26.90, cft: 37.87, vCuota: 100.68 }, 24: { tna: 35.90, cft: 53.22, vCuota: 65.28 }, 36: { tna: 41.90, cft: 64.31, vCuota: 56.56 } },
            quebranto: { 12: 0.0756, 24: 0.0641, 36: 0.0223 }
        },
        oportunidad: { tasas: { 12: { tna: 43.90, cft: 68.16, vCuota: 112.13 }, 24: { tna: 43.90, cft: 68.16, vCuota: 71.00 }, 36: { tna: 43.90, cft: 68.16, vCuota: 58.09 }, 48: { tna: 43.90, cft: 68.16, vCuota: 52.20 }, 60: { tna: 43.90, cft: 68.16, vCuota: 49.06 } } },
        promocional: { premio: 0.05, tasas: { 12: { tna: 51.90, cft: 84.43, vCuota: 117.65 }, 24: { tna: 51.90, cft: 84.43, vCuota: 76.87 }, 36: { tna: 51.90, cft: 84.43, vCuota: 64.37 }, 48: { tna: 51.90, cft: 84.43, vCuota: 58.85 }, 60: { tna: 51.90, cft: 84.43, vCuota: 56.03 } } },
        green: { tasas: { 12: { tna: 37.90, cft: 56.84, vCuota: 108.05 }, 24: { tna: 37.90, cft: 56.84, vCuota: 66.69 }, 36: { tna: 37.90, cft: 56.84, vCuota: 53.52 }, 48: { tna: 37.90, cft: 56.84, vCuota: 47.37 }, 60: { tna: 37.90, cft: 56.84, vCuota: 44.00 } } }
    };

    const anioActual = new Date().getFullYear();
    const selectAnio = document.getElementById('anio');
    for(let i = 0; i <= 13; i++) {
        let anio = anioActual - i;
        let option = document.createElement('option');
        option.value = anio; option.text = anio;
        if(i === 0) option.selected = true;
        selectAnio.appendChild(option);
    }

    function resetearEdicion() {
        editing.anticipo = false;
        editing.monto = false;
    }

    function formatMoney(input) {
        let v = input.value.replace(/\D/g, '');
        if (v === '') { input.value = ''; return; }
        input.value = '$ ' + parseInt(v, 10).toLocaleString('es-AR');
    }

    function getMaxPorcentaje() {
        const antiguedad = anioActual - parseInt(document.getElementById('anio').value);
        if (antiguedad <= 1) return 80;
        if (antiguedad <= 5) return 70;
        if (antiguedad <= 10) return 60;
        if (antiguedad <= 13) return 50;
        return 0;
    }

    function calcularAnticipoMinimo() {
        const slider = document.getElementById('monto');
        if (!slider.disabled) {
            slider.value = slider.max;
            actualizarTextoMonto();
            actualizarCalculo();
        }
    }

    function actualizarMontoMaximo() {
        const valorUnidad = parseInt(document.getElementById('valorUnidad').value.replace(/\D/g, '')) || 0;
        const entregaUsado = parseInt(document.getElementById('entregaUsado').value.replace(/\D/g, '')) || 0;
        let valorNeto = valorUnidad - entregaUsado;
        if (valorNeto < 0) valorNeto = 0; 

        const porcentajeMax = getMaxPorcentaje();
        const slider = document.getElementById('monto');
        const hint = document.getElementById('hintMonto');
        const displayMax = document.getElementById('montoMax');

        if (valorNeto > 0) {
            const montoMaximo = Math.floor(valorNeto * (porcentajeMax / 100));
            slider.disabled = false;
            slider.min = 0; slider.max = montoMaximo; slider.value = montoMaximo;
            displayMax.innerText = '$ ' + montoMaximo.toLocaleString('es-AR');
            hint.innerText = "Tope del " + porcentajeMax + "% sobre el valor neto";
            setTimeout(() => actualizarCalculo(), 0);
        } else {
            slider.disabled = true; slider.value = 0;
            displayMax.innerText = '$ 0'; 
            document.getElementById('montoDisplay').value = '';
            document.getElementById('anticipoInput').value = '';
            hint.innerText = (valorUnidad > 0 && entregaUsado > valorUnidad) ? "La entrega supera el valor del auto" : "";
        }
    }

    function actualizarTextoMonto() {
        const slider = document.getElementById('monto');
        const inputDisplay = document.getElementById('montoDisplay');
        const montoActual = parseInt(slider.value);
        if (!editing.monto) {
            inputDisplay.value = '$ ' + montoActual.toLocaleString('es-AR');
        }
    }

    function handleManualInput(input) {
        editing.monto = true;
        let v = input.value.replace(/\D/g, '');
        if (v === '') { input.value = ''; actualizarCalculo(); return; }
        let valor = parseInt(v, 10);
        const slider = document.getElementById('monto');
        const max = parseInt(slider.max);
        if (valor > max) { valor = max; }
        input.value = '$ ' + valor.toLocaleString('es-AR');
        slider.value = valor;
        actualizarCalculo();
    }

    function handleAnticipoInput(input) {
        editing.anticipo = true;
        let v = input.value.replace(/\D/g, '');
        if (v === '') { input.value = ''; actualizarCalculo(); return; }

        // Redondear hacia arriba siempre
        let valor = Math.ceil(parseFloat(v));
        input.value = '$ ' + valor.toLocaleString('es-AR');

        let anticipoDeseado = valor;
        const valorUnidad = parseFloat(document.getElementById('valorUnidad').value.replace(/[^0-9]/g, '')) || 0;
        const entregaUsado = parseFloat(document.getElementById('entregaUsado').value.replace(/[^0-9]/g, '')) || 0;
        const slider = document.getElementById('monto');
        const maxFinanciable = parseInt(slider.max);

        const tipo = document.getElementById('tipo').value;
        const cuotas = parseInt(document.getElementById('cuotas').value);
        const config = datosFinanciacion[tipo];
        const datosTasa = config.tasas[cuotas];

        let k_gastos = 0;
        k_gastos += (datosTasa.vCuota * cuotas / 1000) * 0.03;

        if (config.quebranto && config.quebranto[cuotas]) {
            k_gastos += config.quebranto[cuotas];
        }

        let montoCalculado = (valorUnidad - entregaUsado - anticipoDeseado) / (1 - k_gastos);

        if (montoCalculado > maxFinanciable) {
            montoCalculado = maxFinanciable;
        }
        if (montoCalculado < 0) {
            montoCalculado = 0;
        }

        slider.value = montoCalculado;
        actualizarTextoMonto();

        actualizarCalculo();
    }

    function finalizarEdicion(campo) {
        if (campo === 'monto') {
            editing.monto = false;
            document.getElementById('montoDisplay').value = '$ ' + parseInt(document.getElementById('monto').value).toLocaleString('es-AR');
        } else {
            editing.anticipo = false;
            let v = document.getElementById('anticipoInput').value.replace(/\D/g, '');
            document.getElementById('anticipoInput').value = '$ ' + Math.ceil(parseFloat(v || 0)).toLocaleString('es-AR');
        }
    }

    function actualizarCuotas() {
        const tipo = document.getElementById('tipo').value;
        const selectCuotas = document.getElementById('cuotas');
        selectCuotas.innerHTML = '';
        let plazos = (tipo === 'especial') ? [12, 24, 36] : [12, 24, 36, 48, 60];
        plazos.forEach(plazo => {
            let option = document.createElement('option');
            option.value = plazo; option.text = plazo + " cuotas";
            if(plazo === 12) option.selected = true;
            selectCuotas.appendChild(option);
        });
    }

    function actualizarCalculo() {
        const valorUnidad = parseFloat(document.getElementById('valorUnidad').value.replace(/[^0-9]/g, '')) || 0;
        const entregaUsado = parseFloat(document.getElementById('entregaUsado').value.replace(/[^0-9]/g, '')) || 0;
        let valorNeto = valorUnidad - entregaUsado;
        if (valorNeto < 0) valorNeto = 0;

        let monto = parseInt(document.getElementById('monto').value) || 0;
        const mensajeInicial = document.getElementById('mensaje-inicial');
        const detalle = document.getElementById('detalle-calculado');

        if (valorUnidad <= 0) {
            mensajeInicial.style.display = 'block'; detalle.style.display = 'none'; return;
        }
        mensajeInicial.style.display = 'none'; detalle.style.display = 'block';

        const tipo = document.getElementById('tipo').value;
        const cuotas = parseInt(document.getElementById('cuotas').value);
        const porcentajeMax = getMaxPorcentaje();
        const montoMaxPermitido = valorNeto * (porcentajeMax / 100);
        const avisoLimite = document.getElementById('avisoLimite');
        avisoLimite.style.display = 'none';

        if (monto > montoMaxPermitido) {
            monto = Math.floor(montoMaxPermitido);
            document.getElementById('monto').value = monto;
            actualizarTextoMonto();
        }

        const config = datosFinanciacion[tipo];
        const datosTasa = config.tasas[cuotas];
        
        let capitalFinal = monto;
        let textoExtra = "";
        let quebranto = 0;

        if (config.quebranto && config.quebranto[cuotas]) {
            const quebrantoPorc = config.quebranto[cuotas];
            quebranto = monto * quebrantoPorc;
        } 
        else if (config.premio) {
            capitalFinal = monto * (1 + config.premio);
            textoExtra = " (Incluye 5% premio)";
        }

        const cuotaBase = (capitalFinal / 1000) * datosTasa.vCuota;
        const gastoPrenda = (cuotaBase * cuotas) * 0.03;
        const anticipoEfectivo = valorUnidad - monto - entregaUsado;
        const anticipoTotal = anticipoEfectivo + gastoPrenda + quebranto;

        const antiguedad = anioActual - parseInt(document.getElementById('anio').value);

        // >>> REDONDEO HACIA ARRIBA (Math.ceil) PARA TODOS LOS MONTOS <<<
        const cuotaRedondeada = Math.ceil(cuotaBase);
        const prendaRedondeada = Math.ceil(gastoPrenda);
        const quebrantoRedondeado = Math.ceil(quebranto);
        const anticipoRedondeado = Math.ceil(anticipoTotal);
        const capitalRedondeado = Math.ceil(capitalFinal);

        document.getElementById('res-primera-cuota').innerText = "$ " + cuotaRedondeada.toLocaleString('es-AR', { maximumFractionDigits: 0 });
        
        if (!editing.anticipo) {
            document.getElementById('anticipoInput').value = "$ " + anticipoRedondeado.toLocaleString('es-AR', { maximumFractionDigits: 0 });
        }

        if (!editing.monto) {
            document.getElementById('montoDisplay').value = "$ " + monto.toLocaleString('es-AR');
        }

        let detalleHTML = "Valor: $ " + valorUnidad.toLocaleString('es-AR') + "<br>";
        detalleHTML += "Financiado: $ " + monto.toLocaleString('es-AR') + "<br>";
        detalleHTML += "Entrega: $ " + entregaUsado.toLocaleString('es-AR') + "<br>";
        detalleHTML += "Gasto de Prenda (3%): $ " + prendaRedondeada.toLocaleString('es-AR', { maximumFractionDigits: 0 }) + "<br>";
        if (quebranto > 0) {
            detalleHTML += "Quebranto: $ " + quebrantoRedondeado.toLocaleString('es-AR', { maximumFractionDigits: 0 });
        }

        document.getElementById('res-detalle-anticipo').innerHTML = detalleHTML;

        document.getElementById('res-capital').innerText = "$ " + capitalRedondeado.toLocaleString('es-AR', { maximumFractionDigits: 0 }) + textoExtra;
        document.getElementById('res-tna').innerText = datosTasa.tna + "%";
        document.getElementById('res-cft').innerText = datosTasa.cft + "%";
        
        document.getElementById('res-aviso').innerHTML = "Vehículo " + antiguedad + " años | Máx. " + porcentajeMax + "%";
    }

    actualizarCuotas();
    actualizarMontoMaximo();
</script>

</body>
</html>
